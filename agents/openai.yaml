interface:
  display_name: "Playwright QA Automation"
  short_description: "Pipeline kiểm thử bắt buộc: explore trên app thật → plan có truy vết → duyệt → sinh spec → chạy qua cổng ổn định → verdict"
  default_prompt: "Use $playwright-automation on this target. Run the full mandatory pipeline: explore the real app in a browser, show me a traced test plan for approval, generate committable Playwright specs, run them through the stability gate, heal failures by re-observing the live app, and end with a numbered verdict."
