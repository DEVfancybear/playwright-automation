name: Standalone clone smoke

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  terminal-smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Run exactly what an Agent runs for a plain test request
        run: npm run test:standalone
