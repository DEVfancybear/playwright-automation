      #     curl -X POST -H 'Content-type: application/json' \
      #       --data "{\"text\":\"🔴 E2E fail trên ${{ github.ref_name }} — ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
      #       ${{ secrets.SLACK_WEBHOOK }}
