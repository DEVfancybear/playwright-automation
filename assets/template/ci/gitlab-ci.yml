stages:
  - test

e2e:
  stage: test
  # Phiên bản image phải khớp @playwright/test trong package.json.
  image: mcr.microsoft.com/playwright:v{{PW_VERSION}}-noble
  timeout: 60m

  variables:
    CI: 'true'
    BASE_URL: '{{BASE_URL}}'
    API_URL: '{{API_URL}}'
    # TEST_USER / TEST_PASS khai báo trong Settings → CI/CD → Variables (bật Masked).

  cache:
    key:
      files: [package-lock.json]
    paths: [node_modules/]

  script:
    - npm ci
    - npx playwright test

  artifacts:
    when: always
    paths:
      - playwright-report/
      - test-results/
    reports:
      junit: test-results/junit.xml
    expire_in: 2 weeks

  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: $CI_COMMIT_BRANCH == 'main'
    - if: $CI_COMMIT_BRANCH == 'develop'
    - if: $CI_PIPELINE_SOURCE == 'schedule'
